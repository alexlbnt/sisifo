<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sísifo</title>
    <!-- Janelas leves do executável (captura...): fundo transparente, a janela é só o cartão. -->
    <style>
      html, body { background: transparent !important; }
    </style>
    <script>
      // Mesmo tema do app (mesma origem, mesmo localStorage), antes do React montar.
      try {
        var t = localStorage.getItem('sisifo:theme');
        var pref = t ? JSON.parse(t).state.theme : 'system';
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/desktop-main.tsx"></script>
  </body>
</html>
